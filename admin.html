<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        .order {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h2>Restaurant Order Dashboard</h2>
<div id="orders">Waiting for orders...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function displayOrder(order) {
        const div = document.createElement("div");
        div.className = "order";

        const heading = document.createElement("h3");
        heading.textContent = "Order #" + order.id;

        const table = document.createElement("p");
        table.textContent = "Table: " + order.table;

        const items = document.createElement("p");
        items.textContent = "Items: " +
            order.items.map(i => i.name + " - ₹" + i.price).join(", ");

        const total = document.createElement("h3");
        total.textContent = "Total: ₹" + order.total;

        const status = document.createElement("p");
        status.textContent = "Status: " + order.status;

        div.append(heading, table, items, total, status);
        document.getElementById("orders").prepend(div);
    }

    fetch("/orders")
        .then(response => response.json())
        .then(orders => {
            document.getElementById("orders").textContent = "";
            orders.forEach(displayOrder);
        });

    socket.on("newOrder", displayOrder);
</script>

</body>
</html>
