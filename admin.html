<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #222; }
        .order {
            background: white;
            padding: 18px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }
        .total { color: #087b45; font-weight: bold; }
        .status { color: #d17b00; font-weight: bold; }
    </style>
</head>
<body>
<h1>Restaurant Order Dashboard</h1>
<div id="orders">Loading orders...</div>

<script>
    async function loadOrders() {
        const response = await fetch("/orders");
        const orders = await response.json();
        const container = document.getElementById("orders");
        container.innerHTML = "";

        if (orders.length === 0) {
            container.textContent = "No orders yet.";
            return;
        }

        orders.forEach(order => {
            const card = document.createElement("div");
            card.className = "order";

            const items = order.items.map(item =>
                `${item.name} - ₹${item.price}`
            ).join(", ");

            card.innerHTML = `
          <h2>Order #${order.id}</h2>
          <p>Table: ${order.table}</p>
          <p>Items: ${items}</p>
          <p class="total">Total: ₹${order.total}</p>
          <p class="status">Status: ${order.status}</p>
        `;

            container.appendChild(card);
        });
    }

    loadOrders();
    setInterval(loadOrders, 5000);
</script>
</body>
</html>
