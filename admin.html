
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teja Restaurant Admin Dashboard</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #1e293b, #312e81);
            color: white;
            min-height: 100vh;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header h1 { margin: 0; font-size: 28px; }

        .online {
            background: #14532d;
            color: #86efac;
            padding: 10px 16px;
            border-radius: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.09);
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
        }

        .stat-card p { color: #cbd5e1; margin: 0 0 12px; }
        .stat-card h2 { margin: 0; font-size: 30px; }

        .order {
            background: white;
            color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .order h3 { margin-top: 0; color: #4338ca; }
        .order p { line-height: 1.5; }

        .status {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .actions button {
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #334155;
        }

        .actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .actions .accept { background: #15803d; }
        .actions .prepare { background: #d97706; }
        .actions .ready { background: #2563eb; }
        .actions .complete { background: #475569; }

        .empty {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #cbd5e1;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .header h1 { font-size: 23px; }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🍽️ Teja Restaurant Dashboard</h1>
    <span class="online">● System Online</span>
</div>

<div class="stats">
    <div class="stat-card">
        <p>Total Orders</p>
        <h2 id="totalOrders">0</h2>
    </div>
    <div class="stat-card">
        <p>Pending Orders</p>
        <h2 id="pendingOrders">0</h2>
    </div>
    <div class="stat-card">
        <p>Today's Revenue</p>
        <h2 id="revenue">₹0</h2>
    </div>
</div>

<h2>📋 Recent Orders</h2>

<div id="orders">
    <div class="empty">Waiting for orders...</div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();
    const orderContainer = document.getElementById("orders");
    const orderMap = new Map();

    function displayOrder(order) {
        if (!order.id) return;

        orderMap.set(String(order.id), order);
        renderOrders();
    }

    function renderOrders() {
        orderContainer.innerHTML = "";
        const activeOrders = [...orderMap.values()];

        if (activeOrders.length === 0) {
            orderContainer.innerHTML =
                '<div class="empty">No orders yet.</div>';
            return;
        }

          activeOrders.forEach(orders =>{
            const card = document.createElement("div");
            card.className = "order";

            const heading = document.createElement("h3");
            heading.textContent = "Order #" + order.id;

            const table = document.createElement("p");
            table.textContent = "Table: " + order.table;

            const items = document.createElement("p");
            items.textContent = "Items: " + order.items.map(item =>
                item.name + " - ₹" + item.price
            ).join(", ");

            const total = document.createElement("h3");
            total.textContent = "Total: ₹" + order.total;

            const status = document.createElement("span");
            status.className = "status";
            status.textContent = "Status: " + (order.status || "Pending");

            const actions = document.createElement("div");
            actions.className = "actions";

            const stages = [
                { label: "Accept Order", status: "Accepted", className: "accept" },
                { label: "Start Preparing", status: "Preparing", className: "prepare" },
                { label: "Mark Ready", status: "Ready", className: "ready" },
                { label: "Complete Order", status: "Completed", className: "complete" }
            ];

            stages.forEach((stage, index) => {
                const button = document.createElement("button");
                button.textContent = stage.label;
                button.className = stage.className;
                button.disabled =
                    index <= stages.findIndex(s => s.status === order.status) &&
                    order.status !== "Pending";

                button.addEventListener("click", async () => {
                    button.disabled = true;

                    try {
                        const response = await fetch(
                            `/update-order-status/${order.id}`,
                            {
                                method: "PATCH",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    status: stage.status
                                })
                            }
                        );

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(result.message || "Update failed");
                        }

                        displayOrder(result.order);

                    } catch (error) {
                        alert("Unable to update order: " + error.message);
                        button.disabled = false;
                    }
                });

                actions.appendChild(button);
            });
              // Remove completed order
              if (order.status === "Completed") {
                  const removeButton = document.createElement("button");

                  removeButton.textContent = "Remove Order";
                  removeButton.className = "remove";

                  removeButton.addEventListener("click", async () => {
                      if (!confirm("Has the customer completed payment?")) {
                          return;
                      }

                      try {
                          const response = await fetch(
                              `/remove-order/${order.id}`,
                              { method: "DELETE" }
                          );

                          const result = await response.json();

                          if (!response.ok) {
                              throw new Error(result.message);
                          }

                          card.remove();
                          orderMap.delete(order.id);
                          updateStats();

                      } catch (error) {
                          alert("Unable to remove order: " + error.message);
                      }
                  });

                  actions.appendChild(removeButton);
              }

            card.append(heading, table, items, total, status, actions);
            orderContainer.prepend(card);
        });

        updateStats();
    }

    function updateStats() {
        const orders = [...orderMap.values()];

        document.getElementById("totalOrders").textContent = orders.length;

        document.getElementById("pendingOrders").textContent =
            orders.filter(o => !o.status || o.status === "Pending").length;

        const revenue = orders.reduce(
            (sum, order) => sum + Number(order.total || 0), 0
        );

        document.getElementById("revenue").textContent = "₹" + revenue;
    }

    fetch("/orders", {
        cache: "no-store"
    })
        .then(response => response.json())
        .then(orders => orders.forEach(displayOrder))
        .catch((error) => {
            console.error("Order loading error:", error);
            orderContainer.textContent =
                "Unable to load orders: " + error.message;
        });

    socket.on("newOrder", displayOrder);
    socket.on("orderUpdated", displayOrder);
</script>

<script src="/socket.io/socket.io.js"></script>
<script>

</script>
</body>
</html>
